name: Core CI/CD

on:
  workflow_call:
    secrets:
      MANIFEST_REPO_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: JDK 21 Install
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test
        run: mvn -B --no-transfer-progress clean verify

  sonar-scan:
    needs: build-and-test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev-deploy' || github.ref == 'refs/heads/dev')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev-deploy' || github.base_ref == 'dev'))
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JDK 21 Install
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=insighton-core
          -Dsonar.host.url=http://s4.java21.net:9000

      - name: SonarQube Quality Gate
        if: |
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev-deploy')) ||
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev-deploy'))
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://s4.java21.net:9000

  build-and-push:
    needs: [build-and-test, sonar-scan]
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      needs.sonar-scan.result == 'success' &&
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev-deploy')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nhnacademy-aiot3-insighton/insighton-core:latest
            ghcr.io/nhnacademy-aiot3-insighton/insighton-core:${{ github.sha }}

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Update manifest repo
        run: |
          git clone https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/nhnacademy-aiot3-insighton/insighton-k8s-manifests.git
          cd insighton-k8s-manifests
          sed -i "s|image: ghcr.io/nhnacademy-aiot3-insighton/insighton-core:.*|image: ghcr.io/nhnacademy-aiot3-insighton/insighton-core:${{ github.sha }}|" infra/core/deployment.yaml
          grep "image:" infra/core/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/core/deployment.yaml
          git diff --cached --quiet && echo "⚠️ No changes detected — check sed pattern" && exit 1
          git commit -m "chore: update core image to ${{ github.sha }}"
          git push
